<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:#0a0a0a;color:#f0ede8}.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.97);border-bottom:1px solid #222;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px}.nav-logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;letter-spacing:6px;color:#c9a96e;cursor:pointer}.nav-right{display:flex;align-items:center;gap:10px}.nav-btn{background:none;border:none;color:#f0ede8;cursor:pointer;font-size:13px;padding:8px 12px;border-radius:4px}.nav-btn.active{color:#c9a96e}.cart-wrap{position:relative;cursor:pointer;background:none;border:none;color:#f0ede8;font-size:22px;padding:8px}.cart-badge{position:absolute;top:2px;right:2px;background:#c9a96e;color:#0a0a0a;border-radius:50%;width:17px;height:17px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}.lang-btn{background:#1a1a1a;border:1px solid #333;color:#c9a96e;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px}.hero{padding:60px 20px 30px;text-align:center}.hero-title{font-family:'Playfair Display',serif;font-size:clamp(52px,12vw,100px);font-weight:900;letter-spacing:-2px;line-height:1}.hero-title span{color:#c9a96e}.hero-tag{margin-top:12px;font-size:13px;letter-spacing:5px;color:#555;text-transform:uppercase}.filters{padding:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-bottom:1px solid #1a1a1a}.fbtn{background:none;border:1px solid #333;color:#999;padding:7px 18px;border-radius:40px;cursor:pointer;font-size:13px}.fbtn.on{background:#c9a96e;border-color:#c9a96e;color:#0a0a0a;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:#1a1a1a}.card{background:#0a0a0a;cursor:pointer;overflow:hidden}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.card-ph{width:100%;aspect-ratio:3/4;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:52px}.card-info{padding:16px}.card-cat{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}.card-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;margin-bottom:4px}.card-price{color:#c9a96e;font-size:18px;font-weight:500}.sbadge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:6px}.sin{background:#1a3a1a;color:#4caf50}.sout{background:#3a1a1a;color:#f44336}.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:#111;border:1px solid #222;border-radius:8px;max-width:580px;width:100%;max-height:90vh;overflow-y:auto}.modal img{width:100%;max-height:340px;object-fit:cover}.mbody{padding:24px}.mname{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;margin-bottom:6px}.mprice{color:#c9a96e;font-size:26px;font-weight:500;margin-bottom:10px}.mdesc{color:#888;font-size:14px;line-height:1.6;margin-bottom:18px}.mlabel{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chip{padding:8px 16px;border:1px solid #333;border-radius:4px;cursor:pointer;font-size:13px;background:none;color:#f0ede8}.chip.sel{background:#c9a96e;border-color:#c9a96e;color:#0a0a0a;font-weight:600}.btnp{width:100%;padding:16px;background:#c9a96e;color:#0a0a0a;border:none;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:4px;margin-top:10px}.btnp:disabled{opacity:0.4;cursor:not-allowed}.btnclose{background:none;border:none;color:#555;cursor:pointer;font-size:26px;float:right;padding:4px 8px}.cart-page{max-width:600px;margin:0 auto;padding:30px 20px}.cart-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;margin-bottom:24px}.citem{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #1a1a1a}.cimg{width:70px;height:90px;object-fit:cover;border-radius:4px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}.cname{font-family:'Playfair Display',serif;font-size:15px;font-weight:700}.cmeta{font-size:12px;color:#555;margin-top:4px}.cprice{color:#c9a96e;font-size:16px;font-weight:500;margin-top:6px}.qctrl{display:flex;align-items:center;gap:10px;margin-top:8px}.qbtn{background:#1a1a1a;border:none;color:#f0ede8;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:16px}.qnum{font-size:15px;font-weight:600;min-width:20px;text-align:center}.rmbtn{background:none;border:none;color:#555;cursor:pointer;font-size:12px}.ctotal{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-size:18px;font-weight:700}.ctotal span:last-child{color:#c9a96e;font-size:22px}.empty{text-align:center;padding:60px 20px;color:#444}.admin-page{max-width:900px;margin:0 auto;padding:30px 20px}.admin-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}.admin-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:900}.admin-acts{display:flex;gap:10px}.btns{padding:10px 20px;background:#1a1a1a;border:1px solid #333;color:#f0ede8;border-radius:4px;cursor:pointer;font-size:13px}.btnadd{padding:10px 20px;background:#c9a96e;border:none;color:#0a0a0a;border-radius:4px;cursor:pointer;font-size:13px;font-weight:700}.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.acard{background:#111;border:1px solid #222;border-radius:8px;overflow:hidden}.acard img{width:100%;height:170px;object-fit:cover}.acard-ph{width:100%;height:170px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:40px}.acbody{padding:14px}.acname{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;margin-bottom:4px}.acprice{color:#c9a96e;font-size:15px;margin-bottom:10px}.acbtns{display:flex;gap:8px}.btedit{flex:1;padding:8px;background:#1a1a1a;border:1px solid #333;color:#f0ede8;border-radius:4px;cursor:pointer;font-size:12px}.btdel{padding:8px 12px;background:#1a1a1a;border:1px solid #333;color:#f44336;border-radius:4px;cursor:pointer;font-size:12px}.foverlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}.fbox{background:#111;border:1px solid #222;border-radius:8px;padding:28px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto}.ftitle{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;margin-bottom:20px}.fg{margin-bottom:14px}.fl{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:6px}.fi{width:100%;background:#0a0a0a;border:1px solid #333;color:#f0ede8;padding:10px 14px;border-radius:4px;font-size:14px;outline:none}.fi:focus{border-color:#c9a96e}.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fchips{display:flex;flex-wrap:wrap;gap:6px}.fchip{padding:6px 12px;border:1px solid #333;border-radius:4px;cursor:pointer;font-size:12px;background:none;color:#f0ede8}.fchip.on{background:#c9a96e;border-color:#c9a96e;color:#0a0a0a;font-weight:600}.fbtns{display:flex;gap:10px;margin-top:18px}.cbrow{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}.cbrow input{width:18px;height:18px;accent-color:#c9a96e}.login-page{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}.lbox{background:#111;border:1px solid #222;border-radius:8px;padding:40px;width:100%;max-width:360px;text-align:center}.llogo{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;color:#c9a96e;letter-spacing:6px;margin-bottom:6px}.lsub{font-size:12px;letter-spacing:2px;color:#444;margin-bottom:28px;text-transform:uppercase}.linput{width:100%;background:#0a0a0a;border:1px solid #333;color:#f0ede8;padding:12px 16px;border-radius:4px;font-size:15px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px}.lerr{color:#f44336;font-size:13px;margin-bottom:10px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#c9a96e;color:#0a0a0a;padding:12px 28px;border-radius:40px;font-weight:700;font-size:14px;z-index:9999}.noprod{text-align:center;padding:60px 20px;color:#444;font-size:16px}.sbox{background:#111;border:1px solid #222;border-radius:8px;padding:28px;width:100%;max-width:440px}.stitle{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;margin-bottom:20px}.shint{font-size:12px;color:#555;margin-top:6px}.ssaved{color:#4caf50;font-size:13px;margin-bottom:10px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const T={fr:{tagline:"Mode & Style",addToCart:"Ajouter au panier",cart:"Panier",emptyCart:"Panier vide",checkout:"Commander via WhatsApp",total:"Total",size:"Taille",color:"Couleur",inStock:"En stock",outOfStock:"Epuise",admin:"Admin",adminTitle:"Gestion produits",addProduct:"Ajouter",editProduct:"Modifier",save:"Enregistrer",cancel:"Annuler",loginBtn:"Connexion",wrongPass:"Mot de passe incorrect",orderMsg:"Nouvelle commande VAULT\n\n",orderItem:"- {qty}x {name} ({size}, {color}) - {price}EUR\n",orderTotal:"\nTOTAL: {total}EUR\n\nMerci!",all:"Tout",productAdded:"Ajoute!",confirmDelete:"Supprimer?",noProducts:"Aucun produit.",whatsappNum:"Numero WhatsApp",saveSettings:"Sauvegarder",settings:"Parametres",settingsSaved:"Sauvegarde!",lang:"EN"},en:{tagline:"Fashion & Style",addToCart:"Add to Cart",cart:"Cart",emptyCart:"Cart empty",checkout:"Order via WhatsApp",total:"Total",size:"Size",color:"Color",inStock:"In stock",outOfStock:"Out of stock",admin:"Admin",adminTitle:"Products",addProduct:"Add",editProduct:"Edit",save:"Save",cancel:"Cancel",loginBtn:"Login",wrongPass:"Wrong password",orderMsg:"New VAULT order\n\n",orderItem:"- {qty}x {name} ({size}, {color}) - {price}EUR\n",orderTotal:"\nTOTAL: {total}EUR",all:"All",productAdded:"Added!",confirmDelete:"Delete?",noProducts:"No products.",whatsappNum:"WhatsApp Number",saveSettings:"Save",settings:"Settings",settingsSaved:"Saved!",lang:"FR"}};
const S=[{id:1,name:"Veste Oversize",nameEn:"Oversized Jacket",price:89,desc:"Veste oversize tendance.",descEn:"Trendy jacket.",image:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=500&q=80",category:"Vestes",categoryEn:"Jackets",sizes:["S","M","L","XL"],colors:["Beige","Noir"],inStock:true},{id:2,name:"Robe Midi",nameEn:"Midi Dress",price:65,desc:"Robe midi fluide.",descEn:"Fluid dress.",image:"https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500&q=80",category:"Robes",categoryEn:"Dresses",sizes:["XS","S","M","L"],colors:["Noir","Rose"],inStock:true},{id:3,name:"Jean Straight",nameEn:"Straight Jeans",price:55,desc:"Jean classique.",descEn:"Classic jeans.",image:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500&q=80",category:"Bas",categoryEn:"Bottoms",sizes:["S","M","L","XL"],colors:["Bleu","Noir"],inStock:true}];
const gid=()=>Date.now()+Math.random();
const ld=(k,f)=>{try{const d=localStorage.getItem(k);return d?JSON.parse(d):f}catch{return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function App(){
const [lang,setLang]=useState("fr");const t=T[lang];
const [products,setProducts]=useState(()=>ld("vp",S));
const [cart,setCart]=useState([]);const [view,setView]=useState("shop");
const [filter,setFilter]=useState("all");const [toast,setToast]=useState("");
const [logged,setLogged]=useState(false);const [pass,setPass]=useState("");
const [passErr,setPassErr]=useState(false);const [editing,setEditing]=useState(null);
const [showForm,setShowForm]=useState(false);const [wa,setWa]=useState(()=>ld("vwa",""));
const [showSet,setShowSet]=useState(false);const [setSaved,setSetSaved]=useState(false);
const [selProd,setSelProd]=useState(null);const [selSize,setSelSize]=useState("");const [selColor,setSelColor]=useState("");
const blank={name:"",nameEn:"",price:"",desc:"",descEn:"",image:"",category:"",categoryEn:"",sizes:[],colors:[],inStock:true};
const [form,setForm]=useState(blank);
useEffect(()=>sv("vp",products),[products]);
const showT=m=>{setToast(m);setTimeout(()=>setToast(""),2500)};
const addToCart=(p,sz,cl)=>{const key=p.id+"-"+sz+"-"+cl;setCart(prev=>{const ex=prev.find(i=>i.key===key);if(ex)return prev.map(i=>i.key===key?{...i,qty:i.qty+1}:i);return[...prev,{key,product:p,size:sz,color:cl,qty:1}]});showT(t.productAdded);setSelProd(null);setSelSize("");setSelColor("")};
const remCart=k=>setCart(p=>p.filter(i=>i.key!==k));
const updQty=(k,d)=>setCart(p=>p.map(i=>i.key===k?{...i,qty:Math.max(1,i.qty+d)}:i));
const total=cart.reduce((s,i)=>s+i.product.price*i.qty,0);
const count=cart.reduce((s,i)=>s+i.qty,0);
const sendWA=()=>{if(!wa){alert("Configurez WhatsApp dans Admin > Parametres");return}let msg=t.orderMsg;cart.forEach(i=>{msg+=t.orderItem.replace("{qty}",i.qty).replace("{name}",lang==="fr"?i.product.name:(i.product.nameEn||i.product.name)).replace("{size}",i.size).replace("{color}",i.color).replace("{price}",(i.product.price*i.qty).toFixed(2))});msg+=t.orderTotal.replace("{total}",total.toFixed(2));window.open("https://wa.me/"+wa.replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank")};
const doLogin=()=>{if(pass==="vault2024"){setLogged(true);setPassErr(false);setView("admin")}else setPassErr(true)};
const doSave=()=>{if(!form.name||!form.price)return;const p={...form,price:parseFloat(form.price),id:editing?editing.id:gid()};if(editing)setProducts(prev=>prev.map(x=>x.id===editing.id?p:x));else setProducts(prev=>[...prev,p]);setShowForm(false);setEditing(null);setForm(blank)};
const doEdit=p=>{setEditing(p);setForm({...p,price:p.price.toString()});setShowForm(true)};
const doDel=id=>{if(window.confirm(t.confirmDelete))setProducts(p=>p.filter(x=>x.id!==id))};
const togSz=s=>setForm(f=>({...f,sizes:f.sizes.includes(s)?f.sizes.filter(x=>x!==s):[...f.sizes,s]}));
const togCl=c=>setForm(f=>({...f,colors:f.colors.includes(c)?f.colors.filter(x=>x!==c):[...f.colors,c]}));
const cats=[...new Set(products.map(p=>lang==="fr"?p.category:(p.categoryEn||p.category)))];
const filtered=filter==="all"?products:products.filter(p=>(lang==="fr"?p.category:(p.categoryEn||p.category))===filter);
const pname=p=>lang==="fr"?p.name:(p.nameEn||p.name);
const pdesc=p=>lang==="fr"?p.desc:(p.descEn||p.desc);
return(<div>
<nav className="nav"><div className="nav-logo" onClick={()=>setView("shop")}>VAULT</div>
<div className="nav-right">
<button className={"nav-btn"+(view==="shop"?" active":"")} onClick={()=>setView("shop")}>{lang==="fr"?"Boutique":"Shop"}</button>
<button className="cart-wrap" onClick={()=>setView("cart")}>🛍️{count>0&&<span className="cart-badge">{count}</span>}</button>
<button className="nav-btn" onClick={()=>logged?setView("admin"):setView("login")}>{t.admin}</button>
<button className="lang-btn" onClick={()=>setLang(lang==="fr"?"en":"fr")}>{t.lang}</button>
</div></nav>
{view==="shop"&&<div><div className="hero"><div className="hero-title">V<span>A</span>ULT</div><div className="hero-tag">{t.tagline}</div></div>
<div className="filters"><button className={"fbtn"+(filter==="all"?" on":"")} onClick={()=>setFilter("all")}>{t.all}</button>{cats.map(c=><button key={c} className={"fbtn"+(filter===c?" on":"")} onClick={()=>setFilter(c)}>{c}</button>)}</div>
{filtered.length===0?<div className="noprod">{t.noProducts}</div>:<div className="grid">{filtered.map(p=><div key={p.id} className="card" onClick={()=>{if(p.inStock){setSelProd(p);setSelSize("");setSelColor("")}}}>{p.image?<img src={p.image} alt={p.name}/>:<div className="card-ph">👗</div>}<div className="card-info"><div className="card-cat">{lang==="fr"?p.category:(p.categoryEn||p.category)}</div><div className="card-name">{pname(p)}</div><div className="card-price">{p.price} EUR</div><div className={"sbadge "+(p.inStock?"sin":"sout")}>{p.inStock?t.inStock:t.outOfStock}</div></div></div>)}</div>}</div>}
{selProd&&<div className="overlay" onClick={()=>setSelProd(null)}><div className="modal" onClick={e=>e.stopPropagation()}>{selProd.image?<img src={selProd.image} alt={selProd.name}/>:<div style={{height:200,background:"#1a1a1a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:60}}>👗</div>}<div className="mbody"><button className="btnclose" onClick={()=>setSelProd(null)}>x</button><div className="mname">{pname(selProd)}</div><div className="mprice">{selProd.price} EUR</div><div className="mdesc">{pdesc(selProd)}</div>{selProd.sizes&&selProd.sizes.length>0&&<div><div className="mlabel">{t.size}</div><div className="chips">{selProd.sizes.map(s=><button key={s} className={"chip"+(selSize===s?" sel":"")} onClick={()=>setSelSize(s)}>{s}</button>)}</div></div>}{selProd.colors&&selProd.colors.length>0&&<div><div className="mlabel">{t.color}</div><div className="chips">{selProd.colors.map(c=><button key={c} className={"chip"+(selColor===c?" sel":"")} onClick={()=>setSelColor(c)}>{c}</button>)}</div></div>}<button className="btnp" disabled={(selProd.sizes&&selProd.sizes.length>0&&!selSize)||(selProd.colors&&selProd.colors.length>0&&!selColor)} onClick={()=>addToCart(selProd,selSize||"-",selColor||"-")}>{t.addToCart}</button></div></div></div>}
{view==="cart"&&<div className="cart-page"><div className="cart-title">{t.cart}</div>{cart.length===0?<div className="empty"><div style={{fontSize:48}}>🛍️</div><div>{t.emptyCart}</div></div>:<div>{cart.map(item=><div key={item.key} className="citem">{item.product.image?<img className="cimg" src={item.product.image} alt=""/>:<div className="cimg">👗</div>}<div style={{flex:1}}><div className="cname">{lang==="fr"?item.product.name:(item.product.nameEn||item.product.name)}</div><div className="cmeta">{item.size} - {item.color}</div><div className="cprice">{(item.product.price*item.qty).toFixed(2)} EUR</div><div className="qctrl"><button className="qbtn" onClick={()=>updQty(item.key,-1)}>-</button><span className="qnum">{item.qty}</span><button className="qbtn" onClick={()=>updQty(item.key,1)}>+</button><button className="rmbtn" onClick={()=>remCart(item.key)}>x</button></div></div></div>)}<div className="ctotal"><span>{t.total}</span><span>{total.toFixed(2)} EUR</span></div><button className="btnp" onClick={sendWA}>📱 {t.checkout}</button></div>}</div>}
{view==="login"&&<div className="login-page"><div className="lbox"><div className="llogo">VAULT</div><div className="lsub">{t.admin}</div><input className="linput" type="password" placeholder="vault2024" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()}/>{passErr&&<div className="lerr">{t.wrongPass}</div>}<button className="btnp" onClick={doLogin}>{t.loginBtn}</button></div></div>}
{view==="admin"&&logged&&<div className="admin-page"><div className="admin-hdr"><div className="admin-title">{t.adminTitle}</div><div className="admin-acts"><button className="btns" onClick={()=>setShowSet(true)}>⚙️ {t.settings}</button><button className="btnadd" onClick={()=>{setShowForm(true);setEditing(null);setForm(blank)}}>+ {t.addProduct}</button></div></div>{products.length===0?<div className="noprod">{t.noProducts}</div>:<div className="agrid">{products.map(p=><div key={p.id} className="acard">{p.image?<img src={p.image} alt={p.name}/>:<div className="acard-ph">👗</div>}<div className="acbody"><div className="acname">{p.name}</div><div className="acprice">{p.price} EUR</div><div className={"sbadge "+(p.inStock?"sin":"sout")} style={{marginBottom:10}}>{p.inStock?t.inStock:t.outOfStock}</div><div className="acbtns"><button className="btedit" onClick={()=>doEdit(p)}>✏️ {t.editProduct}</button><button className="btdel" onClick={()=>doDel(p.id)}>🗑️</button></div></div></div>)}</div>}</div>}
{showForm&&<div className="foverlay"><div className="fbox"><div className="ftitle">{editing?t.editProduct:t.addProduct}</div><div className="frow"><div className="fg"><label className="fl">Nom FR</label><input className="fi" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div><div className="fg"><label className="fl">Name EN</label><input className="fi" value={form.nameEn} onChange={e=>setForm({...form,nameEn:e.target.value})}/></div></div><div className="fg"><label className="fl">Prix EUR</label><input className="fi" type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/></div><div className="frow"><div className="fg"><label className="fl">Desc FR</label><input className="fi" value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})}/></div><div className="fg"><label className="fl">Desc EN</label><input className="fi" value={form.descEn} onChange={e=>setForm({...form,descEn:e.target.value})}/></div></div><div className="fg"><label className="fl">Image URL</label><input className="fi" placeholder="https://..." value={form.image} onChange={e=>setForm({...form,image:e.target.value})}/></div><div className="frow"><div className="fg"><label className="fl">Cat FR</label><input className="fi" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}/></div><div className="fg"><label className="fl">Cat EN</label><input className="fi" value={form.categoryEn} onChange={e=>setForm({...form,categoryEn:e.target.value})}/></div></div><div className="fg"><label className="fl">Tailles</label><div className="fchips">{["XS","S","M","L","XL","XXL"].map(s=><button key={s} className={"fchip"+(form.sizes.includes(s)?" on":"")} onClick={()=>togSz(s)}>{s}</button>)}</div></div><div className="fg"><label className="fl">Couleurs</label><div className="fchips">{["Noir","Blanc","Beige","Gris","Bleu","Rouge","Rose","Vert"].map(c=><button key={c} className={"fchip"+(form.colors.includes(c)?" on":"")} onClick={()=>togCl(c)}>{c}</button>)}</div></div><div className="fg"><label className="cbrow"><input type="checkbox" checked={form.inStock} onChange={e=>setForm({...form,inStock:e.target.checked})}/>En stock</label></div><div className="fbtns"><button className="btnp" style={{flex:1}} onClick={doSave}>{t.save}</button><button className="btns" onClick={()=>{setShowForm(false);setEditing(null)}}>{t.cancel}</button></div></div></div>}
{showSet&&<div className="foverlay"><div className="sbox"><div className="stitle">⚙️ {t.settings}</div><div className="fg"><label className="fl">{t.whatsappNum}</label><input className="fi" placeholder="33612345678" value={wa} onChange={e=>setWa(e.target.value)}/><div className="shint">Code pays + numero ex: 33612345678</div></div>{setSaved&&<div className="ssaved">{t.settingsSaved}</div>}<div className="fbtns"><button className="btnp" style={{flex:1}} onClick={()=>{sv("vwa",wa);setSetSaved(true);setTimeout(()=>setSetSaved(false),2000)}}>{t.saveSettings}</button><button className="btns" onClick={()=>setShowSet(false)}>{t.cancel}</button></div></div></div>}
{toast&&<div className="toast">{toast}</div>}
</div>)}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
